<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunerite practice mockup</title>
<style>
@font-face{font-family:"Silkscreen";src:url(../fonts/Silkscreen-Regular.ttf) format("truetype");font-weight:400}
@font-face{font-family:"Silkscreen";src:url(../fonts/Silkscreen-Bold.ttf) format("truetype");font-weight:700}
:root{--dp:1px}
:root,[data-theme="utility"]{   /* dark, matte, black plastic, white print */
  --wall:#18181a;--wall-sh:#0d0d0e;--ink:#050506;--print:#e2ded2;--print-lo:#8c897e;
  --body:#2b2c2f;--body-hi:#3d3e42;--body-lo:#212225;--lip:#141415;--clay:#e07a33;--sun:#e0922f;
  --teal:#54565c;--teal-lo:#3b3c40;--teal-hi:#6b6d74;--glass:#0f100c;--inset:#000;--groove:#222326;--dotc:#3b3c40;
  --lcd-bg:#2a1d0a;--lcd-fg:#ffc65e;--lcd-lab:#f0b650;--lcd-dim:#6b4f1f;--lcd-off:#0f100c;--lcd-sh:#08090a;--lcd-on:#2a1b05;--lcd-glow:rgba(255,170,50,.6);
  --lamp-r0:#3a2420;--lamp-g0:#22332a;--lamp-r:#d9704a;--lamp-g:#8fcf7a;--pwr0:#4a2a22;--pwr:#e8693a;
  --dface:#1c1d1f;--dface2:#151617;--dprint:#e2ded2;--dprint2:#8c897e;--dacc:#e07a33;--dzone:#e07a33;
  --dsh:#000;--dshop:.7;--dshield:#050506;--dshield2:#3d3e42;--dtop:#000;--dtopo:.6}
[data-theme="solar"]{--note:#6d6650;          /* light sage, cel-shaded, solarpunk */
  --wall:#d9d1bb;--wall-sh:#bdb59e;--ink:#262d20;--print:#262d20;--print-lo:#4a5640;
  --body:#8c9b7c;--body-hi:#a4b293;--body-lo:#76866a;--lip:#55644b;--clay:#b4623e;--sun:#cfa84a;
  --teal:#6f968c;--teal-lo:#587b72;--teal-hi:#8db3a8;--glass:#1d2418;--inset:#161b11;--groove:#3c4733;--dotc:#59664d;
  --lcd-bg:#232a17;--lcd-fg:#e9d56b;--lcd-lab:#c9b552;--lcd-dim:#6b6430;--lcd-off:#1d2418;--lcd-sh:#151b11;--lcd-on:#262208;--lcd-glow:rgba(230,211,106,.5);
  --lamp-r0:#5b4337;--lamp-g0:#3b5a45;--lamp-r:#d9704a;--lamp-g:#8fcf7a;--pwr0:#6a4a38;--pwr:#e08a4e;
  --dface:#e8dfc4;--dface2:#d8cda9;--dprint:#262d20;--dprint2:#6b6650;--dacc:#b4623e;--dzone:#5d8a6a;
  --dsh:#1a2014;--dshop:.26;--dshield:#262d20;--dshield2:#4d5a42;--dtop:#1a2014;--dtopo:.32}
[data-theme="tu12"]{--note:#6d6a5c;            /* olive-grey case, orange dial, red LEDs: after the Boss TU-12 */
  --wall:#cfcabb;--wall-sh:#aaa597;--ink:#14130f;--print:#efeadb;--print-lo:#c5c0ae;
  --body:#6f7566;--body-hi:#868c7c;--body-lo:#5a6052;--lip:#3a3e33;--clay:#f08a3a;--sun:#e0922f;
  --teal:#4f9a96;--teal-lo:#3a7774;--teal-hi:#6cb8b3;--glass:#120605;--inset:#000;--groove:#2a2c24;--dotc:#3b3c34;
  --lcd-bg:#2a0d0b;--lcd-fg:#ff5a4a;--lcd-lab:#d9483a;--lcd-dim:#6b2a24;--lcd-off:#1a0907;--lcd-sh:#120605;--lcd-on:#2a0705;--lcd-glow:rgba(255,80,60,.55);
  --lamp-r0:#4a2a22;--lamp-g0:#22332a;--lamp-r:#ff6a4a;--lamp-g:#8fe07a;--pwr0:#4a2a22;--pwr:#ff7a3a;
  --dface:#e89b3d;--dface2:#d98a2e;--dprint:#1b1409;--dprint2:#5a3a14;--dacc:#8a1f12;--dzone:#1b1409;
  --dsh:#5a2f00;--dshop:.45;--dshield:#14130f;--dshield2:#3a3e33;--dtop:#3a1d00;--dtopo:.35}
[data-theme="phosphor"]{        /* green phosphor on black, workshop instrument */
  --wall:#0b0f0b;--wall-sh:#060806;--ink:#020402;--print:#b8e0b0;--print-lo:#6e9a68;
  --body:#1a211a;--body-hi:#2a342a;--body-lo:#121812;--lip:#0b0f0b;--clay:#c8f04a;--sun:#8fd46a;
  --teal:#2f4a33;--teal-lo:#223825;--teal-hi:#3f6544;--glass:#040a04;--inset:#000;--groove:#172017;--dotc:#263326;
  --lcd-bg:#071207;--lcd-fg:#6dff7a;--lcd-lab:#3fbf55;--lcd-dim:#1f5a2a;--lcd-off:#040a04;--lcd-sh:#030603;--lcd-on:#031004;--lcd-glow:rgba(80,255,110,.5);
  --lamp-r0:#3a2420;--lamp-g0:#14281a;--lamp-r:#ff7a50;--lamp-g:#6dff7a;--pwr0:#1f3a22;--pwr:#6dff7a;
  --dface:#071007;--dface2:#050a05;--dprint:#9fe8a0;--dprint2:#4f7f52;--dacc:#d4f04a;--dzone:#6dff7a;
  --dsh:#000;--dshop:.6;--dshield:#020402;--dshield2:#223825;--dtop:#000;--dtopo:.6}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--wall);font-family:"Silkscreen",ui-monospace,monospace;color:var(--print);user-select:none;-webkit-user-select:none}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;zoom:var(--s,1)}
.device{position:absolute;left:20px;right:20px;top:22px;bottom:52px;background:var(--body);border:4px solid var(--ink);border-radius:30px;padding:16px 24px 20px;
  box-shadow:inset 0 10px 0 var(--body-hi),inset 0 -16px 0 var(--body-lo),0 12px 0 var(--ink),0 14px 0 var(--lip),0 40px 0 var(--wall-sh);
  display:grid;grid-template-columns:770px 1fr;grid-template-rows:auto 1fr;gap:14px 24px}
.screw{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--body-lo);border:3px solid var(--ink);box-shadow:inset 0 3px 0 var(--body-hi)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:3px;height:2px;background:var(--ink);transform:rotate(35deg)}
.screw.a{left:12px;top:12px}.screw.b{right:12px;top:12px}.screw.c{left:12px;bottom:16px}.screw.d{right:12px;bottom:16px}
.head{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px 0 10px}
.brand{font-weight:700;font-size:22px;letter-spacing:4px;line-height:1}
.brand small{display:block;font-weight:400;font-size:12px;letter-spacing:3px;margin-top:6px;color:var(--print-lo)}
.chips{display:flex;gap:10px;margin-left:34px}
.chip{background:var(--lcd-bg);border:3px solid var(--ink);border-radius:8px;padding:4px 12px 5px;box-shadow:inset 0 4px 0 var(--inset);position:relative;overflow:hidden;min-width:96px}
.chip::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3)),repeating-linear-gradient(90deg,rgba(0,0,0,.26) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3))}
.chip small{display:block;font-size:11px;letter-spacing:2px;color:var(--lcd-lab)}
.chip b{display:block;font-weight:400;font-size:16px;letter-spacing:2px;color:var(--lcd-fg);text-shadow:0 0 6px var(--lcd-glow);margin-top:2px}
.chip .xp{height:6px;margin-top:4px;background:var(--lcd-off);border:1px solid var(--ink);position:relative}
.chip .xp i{position:absolute;left:0;top:0;bottom:0;background:var(--lcd-fg);box-shadow:0 0 6px var(--lcd-glow);transition:width .6s}
.themebtn{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--body-lo);border:3px solid var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--print-lo);font:400 12px "Silkscreen",monospace;letter-spacing:3px;box-shadow:inset 0 3px 0 var(--lip),0 3px 0 var(--ink)}
.themebtn b{font-weight:400;color:var(--clay)}
.themebtn:active{transform:translateY(2px)}
.pwr{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:3px;margin-left:12px}
.pwr i{width:14px;height:14px;border-radius:50%;background:var(--pwr);border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 10px var(--pwr)}

/* the screen: a big recessed LCD, the whole game lives here */
.pleft{display:flex;flex-direction:column;gap:12px;min-height:0}
.bezel{background:var(--ink);border-radius:18px;padding:10px;box-shadow:inset 0 5px 0 var(--inset),0 4px 0 var(--body-hi),0 6px 0 var(--ink)}
.scr{position:relative;border-radius:8px;overflow:hidden;background:var(--lcd-off);line-height:0}
.scr canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;--gn:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3)),repeating-linear-gradient(90deg,rgba(0,0,0,.26) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3))}
.scr::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 8px 0 rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.35)}
.ticker{position:relative;background:var(--lcd-bg);border:3px solid var(--ink);border-radius:8px;padding:8px 14px;box-shadow:inset 0 5px 0 var(--inset),0 3px 0 var(--body-hi);overflow:hidden;display:flex;align-items:center;gap:14px;height:44px}
.ticker::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3)),repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 var(--dp),transparent var(--dp) calc(var(--dp)*3))}
.ticker span{font-size:14px;letter-spacing:2px;color:var(--lcd-fg);text-shadow:-1px 0 rgba(255,50,50,.5),1px 0 rgba(60,170,255,.4),0 0 8px var(--lcd-glow);white-space:nowrap;text-transform:uppercase}
.lamps{margin-left:auto;display:flex;gap:16px;position:relative;z-index:2}
.lamps div{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--lcd-lab)}
.lamp{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--lamp-r0);transition:.08s;box-shadow:inset 0 3px 0 rgba(0,0,0,.35)}
.lamp.g{background:var(--lamp-g0)}
.lamp.r.lit{background:var(--lamp-r);box-shadow:0 0 12px var(--lamp-r)}
.lamp.g.lit{background:var(--lamp-g);box-shadow:0 0 12px var(--lamp-g)}

/* the controls */
.pright{display:flex;flex-direction:column;gap:14px;min-height:0}
.well{background:var(--body-lo);border:3px solid var(--ink);border-radius:12px;padding:10px 12px 12px;box-shadow:inset 0 5px 0 var(--lip),0 3px 0 var(--body-hi);position:relative}
.well h4{margin:0 0 10px;font:400 12px "Silkscreen",monospace;letter-spacing:3px;color:var(--print-lo)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.mlabels{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.mlabels button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0 8px;color:var(--print-lo);font:400 12px "Silkscreen",monospace;letter-spacing:2px;position:relative;transition:color .2s}
.mlabels button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mlabels button.on{color:var(--clay)}
.mlabels button::after{content:"";position:absolute;left:50%;bottom:-4px;width:3px;height:6px;background:var(--ink);transform:translateX(-50%)}
.mtrack{position:relative;height:56px;background:var(--glass);border:3px solid var(--ink);border-radius:12px;box-shadow:inset 0 8px 0 var(--inset),0 3px 0 var(--body-hi);touch-action:none;cursor:pointer;margin:0 2px}
.mtrack::before{content:"";position:absolute;left:12.5%;right:12.5%;top:50%;height:4px;margin-top:-2px;background:var(--groove);border-radius:2px}
.mtrack:focus-visible{outline:3px solid var(--clay);outline-offset:3px}
.mdot{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--dotc)}
.mknob{position:absolute;top:3px;bottom:3px;width:calc(25% - 6px);left:calc(var(--i,0)*25% + 3px);
  background:repeating-linear-gradient(90deg,var(--teal-hi) 0 5px,var(--teal) 5px 7px);border:3px solid var(--ink);border-radius:6px;box-shadow:0 7px 0 rgba(0,0,0,.45);transition:left .12s ease-out}
.mknob::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:10px;margin-left:-5px;background:var(--glass);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.mknob::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1px;background:var(--clay);z-index:1}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.cap{display:flex;flex-direction:column;align-items:center;gap:20px;font-size:12px;letter-spacing:2px;color:var(--print)}
.cap button{--lift:8px;width:62px;height:52px;padding:0;border-radius:16px;border:3px solid var(--ink);cursor:pointer;color:var(--print);display:grid;place-items:center;position:relative;
  background:linear-gradient(180deg,var(--teal-hi) 0 22%,var(--teal) 22%,var(--teal-lo));box-shadow:0 var(--lift) 0 var(--ink),0 calc(var(--lift) + 8px) 0 rgba(0,0,0,.28);transition:transform .06s,box-shadow .06s}
.cap button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cap button:active,.cap button.press{transform:translateY(calc(var(--lift) - 1px));box-shadow:0 1px 0 var(--ink),0 3px 0 rgba(0,0,0,.28)}
.cap button:disabled{opacity:.4;cursor:default;transform:none}
.cap button::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--lamp-g0);border:2px solid var(--ink)}
.cap.go button::after{background:var(--lamp-g);box-shadow:0 0 8px var(--lamp-g)}
.cap button.nolamp::after{display:none}
.big{width:110px!important;height:60px!important;border-radius:16px!important;background:linear-gradient(180deg,color-mix(in srgb,var(--clay) 65%,#fff) 0 22%,var(--clay) 22%,color-mix(in srgb,var(--clay) 62%,#000))!important;color:var(--ink)!important}
.big svg{width:30px;height:30px}
.screen-hint{font-size:11px;letter-spacing:2px;color:var(--print-lo);text-align:center;line-height:16px}


/* ---- phone / portrait: a 430 wide device that scrolls, the screen on top, the controls under it ---- */
body.port{overflow-y:auto;overflow-x:hidden}
html:has(body.port){overflow:auto;height:auto;scrollbar-width:none}
html:has(body.port)::-webkit-scrollbar{display:none}
body.port{height:auto;min-height:100%}
body.port .stage{position:relative;left:auto;top:auto;width:430px;height:auto;margin:0 auto}
body.port .device{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:14px 12px 56px;grid-template-columns:1fr;grid-template-rows:auto;gap:14px;padding:14px 14px 22px;border-radius:26px}
body.port .head{flex-wrap:wrap;row-gap:8px;padding:0 4px 0 14px;gap:8px}
body.port .brand{font-size:18px}
body.port .pwr{display:none}
body.port .themebtn{margin-left:auto;padding:4px 8px;font-size:10px}
body.port .chips{margin-left:0;order:3;width:100%;gap:6px}
body.port .chip{flex:1;min-width:0;padding:3px 8px}
body.port .chip b{font-size:12px}
body.port .pleft{gap:10px}
body.port .scr canvas{width:100%}
body.port .pright{gap:12px}
body.port .well{padding:8px 10px 12px}
body.port .cap button{width:56px;height:46px}
body.port .big{width:92px!important;height:54px!important}
body.port .screen-hint{display:none}
body.port .device>*,body.port .pleft>*,body.port .pright>*{min-width:0}
body.port .ticker span{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
body.port .lamps{gap:8px;flex:none}
body.port .lamps div{font-size:10px;gap:4px}
body.port .ticker{height:38px;padding:6px 10px}
body.port .ticker span{font-size:12px}
</style>
</head>
<body data-theme="utility">
<div class="stage" id="stage"><div class="device">
  <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
  <div class="head">
    <div class="brand">TUNERITE<small>PRACTICE MODE</small></div>
    <div class="chips">
      <div class="chip"><small>PLAYER LV</small><b id="cLv">07</b><div class="xp"><i id="cXp" style="width:60%"></i></div></div>
      <div class="chip"><small>STARS</small><b id="cStars">0</b></div>
      <div class="chip"><small>STREAK</small><b id="cStreak">5 DAYS</b></div>
    </div>
    <button class="themebtn" id="themeBtn">THEME <b id="themeName">UTILITY</b></button>
    <div class="pwr"><i></i>POWER</div>
  </div>

  <div class="pleft">
    <div class="bezel"><div class="scr"><canvas id="cv" width="750" height="446"></canvas></div></div>
    <div class="ticker"><span id="tick">Pick a level and press start</span>
      <div class="lamps"><div>HIT<i class="lamp g" id="lHit"></i></div><div>MISS<i class="lamp r" id="lMiss"></i></div></div></div>
  </div>

  <div class="pright">
    <div class="well" id="wSrc"><h4>SOUND SOURCE</h4>
      <div class="mlabels" id="mlabels">
        <button data-m="sing"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>SING</button>
        <button data-m="piano"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v8M15 5v8M7.5 13h3M13.5 13h3"/></svg>PIANO</button>
        <button data-m="whistle"><svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="5"/><path d="M12 9h9v3h-6M8 11v3"/></svg>WHISTLE</button>
        <button data-m="ear"><svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/><path d="M11 9a1.5 1.5 0 0 1 3 0"/></svg>EAR</button>
      </div>
      <div class="mtrack" id="mtrack" role="slider" tabindex="0" aria-label="Sound source" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><i class="mdot" style="left:12.5%"></i><i class="mdot" style="left:37.5%"></i><i class="mdot" style="left:62.5%"></i><i class="mdot" style="left:87.5%"></i><div class="mknob"></div></div>
    </div>
    <div class="well" id="wCtl"><h4>LEVEL</h4>
      <div class="row">
        <div class="cap"><button id="bPrev" aria-label="Previous level"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>PREV</div>
        <div class="cap"><button class="big" id="bGo" aria-label="Start / OK"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button><span id="goLbl">START</span></div>
        <div class="cap"><button id="bNext" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>NEXT</div>
      </div>
    </div>
    <div class="well" id="wGame"><h4>GAME</h4>
      <div class="row" style="justify-content:space-around">
        <div class="cap" id="capPause"><button id="bPause" disabled aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><span id="pauseLbl">PAUSE</span></div>
        <div class="cap" id="capRep"><button id="bRep" disabled aria-label="Repeat level"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>REPEAT</div>
        <div class="cap"><button id="bBack" class="nolamp" aria-label="Back to map"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>MAP</div>
      </div>
    </div>
    <div class="screen-hint">TAP THE SCREEN OR USE THE KEYS<br>ARROWS · ENTER · ESC</div>
  </div>
</div></div>
<script>

const $=s=>document.querySelector(s), cv=$('#cv'), g=cv.getContext('2d'); let W=750, H=446;
g.imageSmoothingEnabled=false;
/* ---------- fit to the window ---------- */
let NARROW=false; const fit=()=>{ const n=innerWidth/innerHeight<.9; document.body.classList.toggle('port',n); if(n!==NARROW||!cv.dataset.set){ NARROW=n; W=n?360:750; H=n?540:446; cv.width=W; cv.height=H; cv.dataset.set=1; g.imageSmoothingEnabled=false; }
