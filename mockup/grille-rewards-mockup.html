<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tunerite grille rewards mockup</title>
<style>
@font-face{font-family:"Silkscreen";src:url(../fonts/Silkscreen-Regular.ttf) format("truetype");font-weight:400}
@font-face{font-family:"Silkscreen";src:url(../fonts/Silkscreen-Bold.ttf) format("truetype");font-weight:700}
:root{--wall:#18181a;--ink:#050506;--body:#2b2c31;--lo:#141518;--print:#8f9096;--printh:#cfc8b8;--acc:#c0321c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--wall);font-family:"Silkscreen",ui-monospace,monospace;color:var(--print);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* mock-up controls: stand-ins for the singing, not part of the instrument */
.ctl{position:fixed;right:20px;top:20px;width:300px;padding:14px;background:var(--body);border:4px solid var(--ink);border-radius:16px;
  box-shadow:inset 0 4px 0 #46474d,0 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px;z-index:2}
.ctl h1{margin:0;font:700 12px "Silkscreen",monospace;letter-spacing:3px;color:var(--printh)}
.ctl p{margin:0;font-size:9px;line-height:15px;letter-spacing:1px}
.ctl label{font-size:9px;letter-spacing:2px;color:var(--print)}
.keys{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.keys button{height:44px;padding:0;border:3px solid var(--ink);border-radius:6px;cursor:pointer;font:700 9px "Silkscreen",monospace;color:var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 var(--ink)}
.keys button:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25),0 1px 0 var(--ink)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--lo);color:var(--printh);border:3px solid var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;font:400 9px "Silkscreen",monospace;letter-spacing:2px;box-shadow:inset 0 3px 0 #2a2b30,0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px)}
.btn.on{color:var(--ink);background:#e0b43a}
.score{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;letter-spacing:2px}
.score b{font:700 22px "Silkscreen",monospace;color:#ffb347;letter-spacing:2px;text-shadow:0 0 8px rgba(255,170,60,.6)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ctl">
  <h1>GRILLE REWARDS</h1>
  <p>Hold a note steady for 3 s. It locks in and a square drops into that note's column of the grille.</p>
  <div class="keys" id="keys"></div>
  <div class="row">
    <label>ACCURACY</label>
    <button class="btn on" id="qP">PERFECT ±3¢</button>
    <button class="btn" id="qG">GOOD</button>
  </div>
  <div class="row">
    <button class="btn" id="fast">FAST LOCK</button>
    <button class="btn" id="auto">AUTO DEMO</button>
    <button class="btn" id="clear">CLEAR</button>
  </div>
  <div class="score"><span>SCORE</span><b id="score">0</b></div>
  <p>Keys: A W S E D F T G Y H U J = C … B. Hold Shift for a GOOD (not perfect) note. Three perfect notes in a row pay a bonus.</p>
</div>

<script>
(() => {
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SHARP = NAMES.map(n => n.includes('#'));
const KEYMAP = { a:0, w:1, s:2, d:4, e:3, f:5, t:6, g:7, y:8, h:9, u:10, j:11 };
KEYMAP.d = 4; KEYMAP.e = 3;                       // d = E, e = D#
// one hue per semitone round the wheel; the half notes are the same family, deeper
const hue = n => (n * 30 + 355) % 360;
const col = n => SHARP[n] ? `hsl(${hue(n)} 62% 40%)` : `hsl(${hue(n)} 82% 58%)`;
const lite = n => SHARP[n] ? `hsl(${hue(n)} 62% 52%)` : `hsl(${hue(n)} 85% 72%)`;
const dark = n => SHARP[n] ? `hsl(${hue(n)} 62% 28%)` : `hsl(${hue(n)} 80% 42%)`;

// grille geometry, in design px
const COLS = 12, SLOT = 34, SLAT = 8, PITCH = SLOT + SLAT, SQ = 30, ROWS = 7, PADV = 6;
const GW = COLS * PITCH + SLAT, GH = ROWS * SLOT + PADV * 2;
const LOCK_MS = 3000, FAST_MS = 600, GRAV = 2600, INK = '#050506';
const PTS = { square: 100, perfect: 50, bonus: 500 };

const cv = document.getElementById('cv'), g = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, S = 1, OX = 0, OY = 0;     // OX/OY: screen position of the grille's inner top-left
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  S = Math.min(1.3, (W - 48) / (GW + 6), (H - 120) / (GH + 60)); S = Math.max(.4, S);
  OX = 24 + 3 * S; OY = H - 56 * S - GH * S;
}
addEventListener('resize', resize); resize();

const cols = Array.from({ length: COLS }, () => []);   // squares resting or falling in each column, bottom first
const parts = [], pops = [];
let lock = null, score = 0, streak = 0, flash = 0, fast = false, perfectMode = true, auto = false, shake = 0;

const $ = id => document.getElementById(id);
$('keys').innerHTML = NAMES.map((n, i) => `<button data-n="${i}" style="background:${col(i)}">${n}</button>`).join('');
$('keys').onclick = e => { const b = e.target.closest('button'); if (b) startLock(+b.dataset.n, perfectMode); };
const setQ = p => { perfectMode = p; $('qP').classList.toggle('on', p); $('qG').classList.toggle('on', !p); };
$('qP').onclick = () => setQ(true); $('qG').onclick = () => setQ(false);
$('fast').onclick = e => { fast = !fast; e.currentTarget.classList.toggle('on', fast); };
$('auto').onclick = e => { auto = !auto; e.currentTarget.classList.toggle('on', auto); };
$('clear').onclick = () => { cols.forEach(c => c.length = 0); score = 0; streak = 0; $('score').textContent = 0; };
addEventListener('keydown', e => { if (e.repeat || e.ctrlKey || e.metaKey) return; const n = KEYMAP[e.key.toLowerCase()]; if (n != null) startLock(n, !e.shiftKey && perfectMode); });

function startLock(n, perfect) { lock = { n, perfect, t: 0, ms: fast ? FAST_MS : LOCK_MS }; }

function drop(n, perfect, bonus) {
  const list = cols[n];
  if (list.length >= ROWS) { const old = list.shift(); burst(old.x + SQ / 2, old.y + SQ / 2, col(old.n), 8); }   // a full column loses its bottom square
  list.push({ n, perfect, bonus, x: n * PITCH + SLAT + (SLOT - SQ) / 2, y: -OY / S - 60, vy: 0, squash: 0, landed: false, born: performance.now() });
}

function burst(x, y, color, k, spd = 160) {
  for (let i = 0; i < k; i++) { const a = Math.random() * Math.PI * 2, s = spd * (.3 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .4, t: 0, c: color, z: 3 + (Math.random() * 3 | 0) }); }
}

function complete() {
  const { n, perfect } = lock; lock = null;
  drop(n, perfect, false); score += PTS.square;
  if (perfect) {
    score += PTS.perfect; streak++;
    if (streak >= 3) {                                   // three perfect notes in a row
      streak = 0; score += PTS.bonus; flash = 1; shake = 1;
      setTimeout(() => drop(n, true, true), 350);        // the bonus square is a rainbow one
      pops.push({ text: '3 PERFECT!', sub: `BONUS +${PTS.bonus}`, t: 0 });
      for (let i = 0; i < 70; i++) burst(GW * Math.random(), -OY / S - 30, `hsl(${Math.random() * 360} 90% 62%)`, 1, 40);
    } else pops.push({ text: `+${PTS.square + PTS.perfect}`, sub: 'PERFECT', t: 0, small: true, x: n * PITCH + SLAT + SLOT / 2 });
  } else { streak = 0; pops.push({ text: `+${PTS.square}`, sub: '', t: 0, small: true, x: n * PITCH + SLAT + SLOT / 2 }); }
  $('score').textContent = score;
}

function rest(i) { return GH - PADV - (i + 1) * SLOT + (SLOT - SQ) / 2; }

function step(dt) {
  if (lock && (lock.t += dt * 1000) >= lock.ms) complete();
  if (!lock && auto) startLock((Math.random() * 12) | 0, Math.random() < .72);
  cols.forEach(list => list.forEach((q, i) => {
    const r = rest(i); q.vy += GRAV * dt; q.y += q.vy * dt;
    if (q.y >= r) {
      if (q.vy > 300) { q.vy = -q.vy * .26; q.squash = 1; if (!q.landed) { q.landed = true; burst(q.x + SQ / 2, r + SQ, '#bdb7a6', 7, 110); if (q.bonus) shake = 1; } } else { q.vy = 0; }
      q.y = r;
    }
    q.squash = Math.max(0, q.squash - dt * 5);
  }));
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) if ((pops[i].t += dt) > (pops[i].small ? 1 : 1.8)) pops.splice(i, 1);
  flash = Math.max(0, flash - dt * 1.6); shake = Math.max(0, shake - dt * 3);
}

/* ---- drawing ---- */
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const T = (s, x, y, px, c, al = 'left') => { g.font = `700 ${px}px Silkscreen, monospace`; g.textAlign = al; g.textBaseline = 'alphabetic'; g.fillStyle = c; g.fillText(s, Math.round(x), Math.round(y)); };

function square(q, now) {
  const sq = q.squash, sx = 1 + .14 * sq, sy = 1 - .16 * sq, x = q.x, y = q.y;
  g.save(); g.translate(x + SQ / 2, y + SQ); g.scale(sx, sy); g.translate(-SQ / 2, -SQ);
  let c, l, d;
  if (q.bonus) { const h = (now / 6) % 360; c = `hsl(${h} 90% 58%)`; l = `hsl(${h} 95% 76%)`; d = `hsl(${h} 80% 38%)`; }
  else { c = col(q.n); l = lite(q.n); d = dark(q.n); }
  if (q.bonus) { g.shadowColor = c; g.shadowBlur = 14; }
  R(0, 0, SQ, SQ, INK); g.shadowBlur = 0;
  R(3, 3, SQ - 6, SQ - 6, c); R(3, 3, SQ - 6, 3, l); R(3, 3, 3, SQ - 6, l); R(3, SQ - 6, SQ - 6, 3, d); R(SQ - 6, 3, 3, SQ - 6, d);
  if (!q.bonus) T(NAMES[q.n], SQ / 2, SQ / 2 + 4, 8, 'rgba(5,5,6,.6)', 'center');
  else T('★', SQ / 2, SQ / 2 + 5, 12, 'rgba(255,255,255,.9)', 'center');
  if (q.perfect && !q.bonus) {                                  // a gold rim and a twinkle for a perfect note
    g.strokeStyle = '#ffd24a'; g.lineWidth = 2; g.strokeRect(1, 1, SQ - 2, SQ - 2);
    const tw = ((now - q.born) / 350) % 4 | 0;
    if (tw < 2) { R(SQ - 10, 3, 5, 1, '#fff'); R(SQ - 8, 1, 1, 5, '#fff'); }
  }
  g.restore();
}

function draw(now) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.imageSmoothingEnabled = false;
  const sh = shake ? Math.sin(now / 18) * 4 * shake : 0;
  g.save(); g.translate(OX + sh, OY); g.scale(S, S);

  // the panel: ink border, recessed well, a slat between every column
  R(-3, -3, GW + 6, GH + 6, INK); R(0, 0, GW, GH, '#141518');
  for (let c = 0; c <= COLS; c++) { R(c * PITCH, 0, SLAT, GH, '#050506'); R(c * PITCH, 0, 2, GH, '#1d1e22'); }
  if (lock) { const x = lock.n * PITCH + SLAT; g.globalAlpha = .18 + .1 * Math.sin(now / 120); R(x, 0, SLOT, GH, col(lock.n)); g.globalAlpha = 1; }
  R(0, 0, GW, 5, 'rgba(0,0,0,.5)'); R(0, GH - 2, GW, 2, 'rgba(255,255,255,.05)');
  // faint note names at the foot of each slot so the columns read as notes
  for (let c = 0; c < COLS; c++) if (!cols[c].length) T(NAMES[c], c * PITCH + SLAT + SLOT / 2, GH - 12, 8, 'rgba(143,144,150,.28)', 'center');

  // squares: resting ones are clipped to the well, falling ones pass over the rim
  cols.forEach(list => list.forEach(q => square(q, now)));
  parts.forEach(p => { g.globalAlpha = Math.max(0, 1 - p.t / p.life); R(p.x, p.y, p.z, p.z, p.c); }); g.globalAlpha = 1;
  if (flash) { g.globalAlpha = flash * .55; R(0, 0, GW, GH, '#fff'); g.globalAlpha = 1; }
  g.restore();

  // lock-in meter and streak lights under the grille (screen space, scaled with the panel)
  g.save(); g.translate(OX, OY + GH * S + 16 * S); g.scale(S, S);
  const mw = GW - 130;
  T(lock ? `LOCKING ${NAMES[lock.n]}` : 'SING A NOTE', 0, 8, 9, lock ? col(lock.n) : '#8f9096');
  R(-2, 14, mw + 4, 16, INK); R(0, 16, mw, 12, '#141518');
  const cells = 30, fill = lock ? Math.floor(lock.t / lock.ms * cells) : 0;
  for (let i = 0; i < cells; i++) R(2 + i * (mw - 4) / cells, 18, (mw - 4) / cells - 2, 8, i < fill ? col(lock.n) : '#26272c');
  T('PERFECT STREAK', GW, 8, 9, '#8f9096', 'right');
  for (let i = 0; i < 3; i++) { const x = GW - 94 + i * 34, on = i < streak; R(x - 2, 14, 30, 16, INK); R(x, 16, 26, 12, on ? '#ffd24a' : '#26272c'); if (on) { R(x, 16, 26, 3, '#fff3b0'); } }
  g.restore();

  // floating score pops and the bonus banner
  g.save(); g.translate(OX, OY); g.scale(S, S);
  pops.forEach(p => {
    if (p.small) { const k = p.t / 1; g.globalAlpha = 1 - k * k; T(p.text, p.x, -8 - 30 * k, 12, '#ffd24a', 'center'); if (p.sub) T(p.sub, p.x, 6 - 30 * k, 7, '#fff', 'center'); }
    else { const k = Math.min(1, p.t / .25), a = p.t > 1.3 ? 1 - (p.t - 1.3) / .5 : 1, y = -70 - 20 * (1 - k) * 0 - p.t * 14; g.globalAlpha = Math.max(0, a);
      const s = 0.6 + 0.4 * Math.min(1, p.t / .2); g.save(); g.translate(GW / 2, y); g.scale(s * 1.6, s * 1.6);
      T(p.text, 2, 2, 22, INK, 'center'); T(p.text, 0, 0, 22, `hsl(${(now / 4) % 360} 95% 65%)`, 'center'); T(p.sub, 0, 20, 10, '#ffd24a', 'center'); g.restore(); }
    g.globalAlpha = 1;
  });
  g.restore();
}

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; step(dt); draw(now); requestAnimationFrame(frame); }
document.fonts.load('700 12px Silkscreen').finally(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
